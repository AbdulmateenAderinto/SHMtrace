[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shmtrace"
version = "0.2.0"
description = "SHMtrace: somatic hypermutation measured from amplicon reads on any platform (nanopore, PacBio, Illumina, Sanger), against matched controls"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Abdulmateen Aderinto", email = "abdulmateen.aderinto@gmail.com" },
    { name = "Alberto Martin" },
]
keywords = [
    "somatic hypermutation", "AID", "nanopore", "immunoglobulin",
    "bioinformatics", "variant calling", "JH4",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "mappy>=2.28",
    "pyyaml>=6.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
bam = ["pysam>=0.22"]
sanger = ["biopython>=1.83"]   # optional: a fallback reader for unusual .ab1 files; a built-in ABIF parser covers the usual ones
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",        # the Results tab's Excel button
]
app = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "pywebview>=5.0",
    "openpyxl>=3.1",
    "pysam>=0.22",
]
excel = ["openpyxl>=3.1"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
shmtrace = "shmtrace.pipeline:main"
shmtrace-compare = "shmtrace.compare:main"
shmtrace-benchmark = "shmtrace.benchmark:main"
shmtrace-validate = "shmtrace.simulate:main"
shmtrace-simulate-lineages = "shmtrace.lineage_sim:main"
shmtrace-sheet = "shmtrace.samplesheet:main"
shmtrace-concordance = "shmtrace.concordance:main"
shmtrace-validate-sanger = "shmtrace.sanger_sim:main"
shmtrace-power = "shmtrace.power:main"
shmtrace-repair = "shmtrace.repair:main"
shmtrace-switch = "shmtrace.switch:main"
shmtrace-screen = "shmtrace.demux:main"
shmtrace-app = "shmtrace.desktop:main"

[project.urls]
Homepage = "https://github.com/martinlab/shmtrace"
Issues = "https://github.com/martinlab/shmtrace/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/shmtrace", "src/nanoshm"]   # nanoshm: the old name, an import alias

[tool.hatch.build.targets.sdist]
include = ["src/shmtrace", "tests", "examples", "docs", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
per-file-ignores = { "src/shmtrace/webapp/main.py" = ["B008"] }  # FastAPI Depends/File/Form idiom
