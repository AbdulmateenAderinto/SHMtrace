# Preset: any amplicon, any region (JH6, Sγ, a V gene, an AID off-target)
name: generic_amplicon
description: >
  A starting point for a region with no preset of its own. Length filters are
  set from the reference at run time (an alignment must cover 65% of it, and a
  read longer than 1.5 times it plus 100 bp is dropped), the analysis window is
  everything except 20 bp at each end, and nothing is assumed about the germline
  beyond the <50% rule. Narrow the window and the filters once you have seen one run.

minimap2_preset: map-ont
# Scaled to the reference at run time (config.scale_lengths): min_align_len becomes
# 65% of it, max_total_len 1.5 times it plus 100 bp of adapter and barcode. A length
# set in a project replaces its fraction. The two fixed values below are what the
# Illumina and Sanger platforms start from, which use lengths as given.
min_align_frac: 0.65
max_total_frac: 1.5
min_align_len: 200
max_total_len: 20000
max_ee_rate: 0.01
drop_supplementary: true
downsample_to: 1000

contaminant_allele_frac: 0.5

analysis_window: null       # everything inside the end trims
germline_freq_threshold: 0.50
max_pvalue: 0.05
per_base_error: 0.001
min_variant_reads: 1
exclude_indels: true
end_trim_bp: 20
density_scale: 100000
